name: build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IntercalarioDigitale.sln

      - name: Build
        run: dotnet build IntercalarioDigitale.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/IntercalarioDigitale.Core.Tests -c Release --no-build

      - name: Publish GerarchIA (Windows x64)
        run: dotnet publish src/IntercalarioDigitale.Desktop -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: GerarchIA-win-x64
          path: publish
